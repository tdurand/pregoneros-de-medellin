<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street walk scroll: JPEG stills vs WebCodecs</title>
<style>
  html, body { margin: 0; background: #000; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
  #viewer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #viewer img, #viewer canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  #viewer .hidden { visibility: hidden; }
  #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 4px; white-space: pre; z-index: 2; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="hud">loading…</div>
<script src="src/StillsPlayer.js"></script>
<script>
// Usage:
//   ?mode=legacy&stills=<base url with lowres/ and highres/ folders>&n=378
//   ?mode=webcodecs&af=<url.af>[,<fallback.af>]
//   add &bench=1 to run the scripted scrub and expose results on window.__bench
var q = new URLSearchParams(location.search);
var MODE = q.get('mode') || 'webcodecs';
var WAY_LENGTH_M = Number(q.get('len') || 123);     // plazabotero-start-carabobo is ~123 m
var hud = document.getElementById('hud');
var viewer = document.getElementById('viewer');
var t0 = performance.now();
var bench = window.__bench = { mode: MODE, frames: [], longTasks: 0, longTaskMs: 0 };

try {
  new PerformanceObserver(function (l) {
    l.getEntries().forEach(function (e) { bench.longTasks++; bench.longTaskMs += e.duration; });
  }).observe({ type: 'longtask', buffered: true });
} catch (e) {}

// Same scroll model as app/views/streetwalk.js: body height = way length * 100px,
// eased position, imgNb = position / (height - innerHeight) * nbStills
document.body.style.height = (WAY_LENGTH_M * 100) + 'px';
var currentPosition = 0;
function stillFromScroll(n) {
  var target = window.pageYOffset;
  var deaccelerate = Math.max(Math.min(Math.abs(target - currentPosition) * 5000, 10), 2);
  currentPosition += (target - currentPosition) / deaccelerate;
  currentPosition = target > currentPosition ? Math.ceil(currentPosition) : Math.floor(currentPosition);
  var avail = document.body.scrollHeight - window.innerHeight;
  return Math.max(0, Math.min(n - 1, Math.floor(currentPosition / avail * n)));
}

// ---------------------------------------------------------------- legacy
// Faithful copy of models/Stills.js + Still.js + streetwalk.renderImg/renderImgHighRes
function Legacy(base, n) {
  var self = this;
  this.n = n;
  this.img = document.createElement('img');
  this.imgHigh = document.createElement('img');
  this.imgHigh.className = 'hidden';
  viewer.appendChild(this.img); viewer.appendChild(this.imgHigh);
  this.stills = []; this.loadedIds = []; this.nbLoaded = 0; this.queue = []; this.open = 0;
  this.shown = -1; this.current = -1;
  function pad(i) { return ('000' + i).slice(-3); }
  [20, 10, 5, 2, 1].forEach(function (step) {
    for (var i = 0; i < n; i += step) {
      if (self.stills[i]) continue;
      self.stills[i] = { id: i, loaded: false, low: base + '/lowres/way' + pad(i) + '.jpg', high: base + '/highres/way' + pad(i) + '.jpg' };
      self.queue.push(self.stills[i]);
    }
  });
  this.ready = new Promise(function (res) { self._ready = res; });
  this.done = new Promise(function (res) { self._done = res; });
  var iv = setInterval(function () {
    while (self.open < 7 && self.queue.length) self._pull(self.queue.shift());
    if (!self.queue.length) clearInterval(iv);
  }, 100);
}
Legacy.prototype._pull = function (s) {
  var self = this, im = new Image();
  this.open++;
  im.onload = function () {
    s.loaded = true; self.open--; self.nbLoaded++; self.loadedIds.push(s.id);
    hud.textContent = 'legacy: ' + self.nbLoaded + '/' + self.n + ' stills';
    if (self.nbLoaded === Math.floor(self.n / 3)) self._ready();   // app starts at 1/3 loaded
    if (self.nbLoaded === self.n) self._done();
  };
  im.src = s.low; s.el = im;
};
Legacy.prototype.show = function (i) {
  var self = this;
  if (i === this.current) return;
  var s = this.stills[i];
  if (!s.loaded) {  // closest loaded still before i, as renderImg does
    var best = -1;
    for (var k = 0; k < this.loadedIds.length; k++) if (this.loadedIds[k] <= i && this.loadedIds[k] > best) best = this.loadedIds[k];
    if (best < 0) return;
    s = this.stills[best];
  }
  if (s.id === this.current) return;
  this.current = s.id;
  this.img.src = s.low;
  // Counted as shown as soon as src is set. Chromium decodes on raster threads, so the
  // real on-screen picture can lag further; this makes the legacy numbers optimistic.
  this.shown = s.id;
  this.imgHigh.className = 'hidden';
  clearTimeout(this.hiT);
  this.hiT = setTimeout(function () {       // highres after 100ms without moving
    var id = self.current;
    self.imgHigh.onload = function () { if (self.current === id) self.imgHigh.className = ''; };
    self.imgHigh.src = self.stills[id].high;
  }, 100);
};

// ---------------------------------------------------------------- webcodecs
function WebCodecs(urls) {
  var self = this;
  this.canvas = document.createElement('canvas');
  viewer.appendChild(this.canvas);
  this.player = new StillsPlayer(this.canvas, {});
  this.ready = (async function () {
    var sources = urls.map(function (u) { return { url: u, codec: null }; });
    // Codec lives in the manifest; peek with a tiny range-less guess from the filename, then verify on load
    var picked = null, lastErr;
    for (var i = 0; i < urls.length && !picked; i++) {
      try {
        await self.player.load(urls[i], function (p) { hud.textContent = 'webcodecs: ' + Math.round(p * 100) + '%'; });
        picked = urls[i];
      } catch (e) { lastErr = e; self.player = new StillsPlayer(self.canvas, {}); }
    }
    if (!picked) throw lastErr || new Error('no playable source');
    self.n = self.player.manifest.totalFrames;
    self.url = picked;
    await new Promise(function (res) { self.player.onFrame = function () { res(); }; self.player.setFrame(0); });
  })();
  this.done = this.ready;
}
WebCodecs.prototype.show = function (i) { this.player.setFrame(i); };
Object.defineProperty(WebCodecs.prototype, 'shown', { get: function () { return this.player.shown; } });

// ---------------------------------------------------------------- run
var view = MODE === 'legacy'
  ? new Legacy(q.get('stills'), Number(q.get('n') || 378))
  : new WebCodecs((q.get('af') || '').split(',').filter(Boolean));

function loop() {
  var i = stillFromScroll(view.n);
  view.show(i);
  if (bench.recording) bench.frames.push([performance.now(), i, view.shown]);
  requestAnimationFrame(loop);
}

view.ready.then(function () {
  bench.readyMs = performance.now() - t0;
  window.scrollTo(0, 0);
  requestAnimationFrame(loop);
  if (q.get('bench')) runScript();
}).catch(function (e) { hud.textContent = 'error: ' + e.message; bench.error = String(e); });
view.done.then(function () { bench.fullyLoadedMs = performance.now() - t0; });

// Scripted scrub, one scroll update per animation frame:
//   1. walk forward the whole street at ~2 m/s of scroll (fast reader)
//   2. flick backward over half the street
//   3. 25 random jumps (map clicks, fast flings), holding each for 250 ms
function runScript() {
  var avail = document.body.scrollHeight - window.innerHeight;
  var steps = [];
  var fwd = 360;
  for (var k = 0; k <= fwd; k++) steps.push(k / fwd * avail);
  for (var k2 = 0; k2 <= 90; k2++) steps.push(avail - k2 / 90 * avail * 0.5);
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var j = 0; j < 25; j++) { var y = rnd() * avail; for (var h = 0; h < 15; h++) steps.push(y); }
  bench.recording = true;
  var idx = 0;
  (function tick() {
    if (idx < steps.length) { window.scrollTo(0, steps[idx++]); requestAnimationFrame(tick); return; }
    setTimeout(function () {
      bench.recording = false;
      summarize();
    }, 500);
  })();
}

function pct(a, p) { if (!a.length) return 0; a = a.slice().sort(function (x, y) { return x - y; }); return a[Math.min(a.length - 1, Math.floor(p * a.length))]; }
function summarize() {
  var f = bench.frames, gaps = [], stale = 0, lagFrames = [];
  for (var i = 1; i < f.length; i++) gaps.push(f[i][0] - f[i - 1][0]);
  // 'stale' = the picture is more than 3 stills (~1 m) away from where the scroll says we are
  f.forEach(function (r) { var d = r[2] < 0 ? r[1] + 1 : Math.abs(r[1] - r[2]); if (d > 3) stale++; lagFrames.push(d); });
  var res = performance.getEntriesByType('resource');
  var bytes = res.reduce(function (s, e) { return s + (e.encodedBodySize || e.transferSize || 0); }, 0);
  bench.summary = {
    mode: MODE,
    source: view.url || q.get('stills'),
    readyMs: Math.round(bench.readyMs),
    fullyLoadedMs: bench.fullyLoadedMs ? Math.round(bench.fullyLoadedMs) : null,
    requests: res.length,
    megabytes: +(bytes / 1048576).toFixed(2),
    ticks: f.length,
    staleTickPct: +(100 * stale / f.length).toFixed(1),
    stillsBehindP50: pct(lagFrames, 0.5),
    stillsBehindP95: pct(lagFrames, 0.95),
    frameGapP50: +pct(gaps, 0.5).toFixed(1),
    frameGapP95: +pct(gaps, 0.95).toFixed(1),
    framesOver50ms: gaps.filter(function (g) { return g > 50; }).length,
    longTasks: bench.longTasks,
    longTaskMs: Math.round(bench.longTaskMs),
    decodeLatencyP50: view.player ? +pct(view.player.stats.latencies, 0.5).toFixed(1) : null,
    decodeLatencyP95: view.player ? +pct(view.player.stats.latencies, 0.95).toFixed(1) : null,
    decodes: view.player ? view.player.stats.decodes : null,
    jsHeapMB: performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null
  };
  hud.textContent = JSON.stringify(bench.summary, null, 1);
  bench.finished = true;
}
</script>
</body>
</html>
