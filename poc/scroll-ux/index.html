<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street walk feel lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #panel { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px 10px;
    align-items: center; background: rgba(0,0,0,.62); padding: 8px 10px; border-radius: 10px; backdrop-filter: blur(6px); max-width: 760px; margin: 0 auto; }
  #panel.min > :not(#toggle) { display: none; }
  .row { display: flex; gap: 4px; align-items: center; }
  .row span { opacity: .7; margin-right: 2px; }
  button { font: inherit; color: #eee; background: rgba(255,255,255,.12); border: 0; border-radius: 6px; padding: 6px 9px; cursor: pointer; }
  button[aria-pressed="true"] { background: #e3ae1c; color: #1b1503; }
  #walk { background: #1f6b4f; font-weight: 600; padding: 8px 14px; user-select: none; -webkit-user-select: none; touch-action: none; }
  #walk.on { background: #74c59f; color: #06140d; }
  #toggle { margin-left: auto; }
  #hud { position: fixed; left: 8px; top: calc(8px + env(safe-area-inset-top)); background: rgba(0,0,0,.5); padding: 4px 7px; border-radius: 6px; font: 12px/1.3 ui-monospace, monospace; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="panel">
  <div class="row" data-opt="ease"><span>Follow</span>
    <button data-v="2015" title="The 2015 easing: moves 1/10 of the remaining distance per frame">2015</button>
    <button data-v="light" title="Moves 1/3 of the remaining distance per frame">Light</button>
    <button data-v="direct" title="The picture sits exactly where your finger or wheel is">Direct</button>
  </div>
  <div class="row" data-opt="blend"><span>In-between</span>
    <button data-v="off">Step</button>
    <button data-v="fade" title="Crossfade the two nearest stills by the exact position">Crossfade</button>
  </div>
  <div class="row" data-opt="ppm"><span>Scroll per metre</span>
    <button data-v="50">50px</button>
    <button data-v="100" title="2015 value">100px</button>
    <button data-v="200">200px</button>
  </div>
  <div class="row" data-opt="glide"><span>Fling</span>
    <button data-v="short">Short</button>
    <button data-v="long">Long</button>
  </div>
  <div class="row" data-opt="pace"><span>Auto-walk</span>
    <button data-v="1.4" title="Walking pace">1.4 m/s</button>
    <button data-v="3" title="Brisk / cycling">3 m/s</button>
  </div>
  <button id="walk" title="Hold to walk (or press space). Double-tap to keep walking.">Hold to walk</button>
  <button id="toggle" aria-label="Hide options">▾</button>
</div>
<script>
// A one-page lab for how the walk *feels*: easing, in-between blending,
// scroll distance per metre, fling, and auto-walk. Each option is a URL
// parameter, so a combination can be shared as a link.
//   ?way=<wayName>&assets=<media base>&ease=2015|light|direct&blend=off|fade
//   &ppm=50|100|200&glide=short|long&pace=1.4|3
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var ASSETS = (q.get('assets') || 'https://images.pregonerosdemedellin.com').replace(/\/$/, '');
  var WAY = q.get('way') || 'plazabotero-start-carabobo';
  var WAYS_URL = q.get('ways') || '/content/ways.json';
  var opts = {
    ease: q.get('ease') || '2015',
    blend: q.get('blend') || 'fade',
    ppm: q.get('ppm') || '100',
    glide: q.get('glide') || 'long',
    pace: q.get('pace') || '1.4'
  };

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var hud = document.getElementById('hud');
  var panel = document.getElementById('panel');

  // ---------- options panel ----------
  function syncButtons() {
    panel.querySelectorAll('[data-opt]').forEach(function (row) {
      row.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.v === opts[row.dataset.opt]));
      });
    });
    var u = new URL(location.href);
    Object.keys(opts).forEach(function (k) { u.searchParams.set(k, opts[k]); });
    history.replaceState(null, '', u);
  }
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-opt] button');
    if (!b) return;
    opts[b.parentNode.dataset.opt] = b.dataset.v;
    syncButtons();
    dirty = true;
  });
  document.getElementById('toggle').addEventListener('click', function () {
    panel.classList.toggle('min');
    this.textContent = panel.classList.contains('min') ? '▴' : '▾';
  });
  syncButtons();

  // ---------- stills ----------
  var n = 0, stillsPerMetre = 3, frames = [], hi = { i: -1, img: null, ready: false };
  function pad(i) { return ('00' + i).slice(-3); }
  function url(res, i) { return ASSETS + '/data/' + WAY + '/' + res + '/way' + pad(i) + '.jpg'; }

  function load() {
    // Coarse to fine (every 8th, 4th, 2nd, then all), 6 at a time, like the mobile walk
    var order = [], seen = new Uint8Array(n);
    [8, 4, 2, 1].forEach(function (s) { for (var i = 0; i < n; i += s) if (!seen[i]) { seen[i] = 1; order.push(i); } });
    var next = 0, open = 0;
    function pump() {
      while (open < 6 && next < order.length) {
        (function (i) {
          var img = new Image();
          img.decoding = 'async';
          open++;
          img.onload = function () {
            (img.decode ? img.decode() : Promise.resolve()).catch(function () {}).then(function () {
              frames[i] = img; loaded++; open--; dirty = true; pump();
            });
          };
          img.onerror = function () { open--; pump(); };
          img.src = url('lowres', i);
        })(order[next++]);
      }
    }
    pump();
  }
  var loaded = 0;

  function nearest(i) {
    if (frames[i]) return i;
    for (var d = 1; d < n; d++) {
      if (i - d >= 0 && frames[i - d]) return i - d;
      if (i + d < n && frames[i + d]) return i + d;
    }
    return -1;
  }

  // ---------- position ----------
  // target: where input says we are, in stills. pos: what is shown.
  var target = 0, pos = 0, vel = 0, lastInput = 0, dirty = true;
  function stillsPerPx() { return stillsPerMetre / Number(opts.ppm); }
  function clamp(v) { return Math.max(0, Math.min(n - 1, v)); }
  function nudge(px) { target = clamp(target + px * stillsPerPx()); lastInput = performance.now(); }

  addEventListener('wheel', function (e) {
    e.preventDefault();
    var px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    vel = 0;
    nudge(px);
  }, { passive: false });

  // Touch: drag up to walk forward. On release keep the finger's speed and let it glide.
  var touchY = null, touchT = 0, touchV = 0;
  canvas.addEventListener('pointerdown', function (e) {
    touchY = e.clientY; touchT = e.timeStamp; touchV = 0; vel = 0;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (touchY === null) return;
    var dy = touchY - e.clientY, dt = Math.max(1, e.timeStamp - touchT);
    touchV = 0.8 * (dy / dt) + 0.2 * touchV; // px per ms, smoothed
    touchY = e.clientY; touchT = e.timeStamp;
    nudge(dy);
  });
  function release() {
    if (touchY === null) return;
    touchY = null;
    if (performance.now() - touchT < 80) vel = touchV * 16.67; // px per frame
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  // Auto-walk: hold the button (or space); double-tap it to keep walking.
  var walkBtn = document.getElementById('walk'), walking = false, latched = false, lastTap = 0;
  function setWalking(on) { walking = on; walkBtn.classList.toggle('on', on || latched); }
  walkBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var now = performance.now();
    if (latched) { latched = false; setWalking(false); return; }
    if (now - lastTap < 300) { latched = true; setWalking(true); walkBtn.textContent = 'Walking (tap to stop)'; return; }
    lastTap = now;
    setWalking(true);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) {
    walkBtn.addEventListener(t, function () { if (!latched) setWalking(false); if (!latched) walkBtn.textContent = 'Hold to walk'; });
  });
  addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); setWalking(true); }
    if (e.code === 'ArrowUp') nudge(-60);
    if (e.code === 'ArrowDown') nudge(60);
  });
  addEventListener('keyup', function (e) { if (e.code === 'Space' && !latched) setWalking(false); });

  // ---------- drawing ----------
  function resize() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    dirty = true;
  }
  addEventListener('resize', resize);
  resize();

  function cover(img) {
    var W = canvas.width, H = canvas.height, s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    var w = img.naturalWidth * s, h = img.naturalHeight * s;
    return [(W - w) / 2, (H - h) / 2, w, h];
  }
  function drawImg(img, alpha) {
    var r = cover(img);
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, r[0], r[1], r[2], r[3]);
  }

  var shownIdx = -1;
  function draw() {
    var a = Math.floor(pos), f = pos - a, b = Math.min(n - 1, a + 1);
    var ia = nearest(a);
    if (ia < 0) return;
    ctx.imageSmoothingQuality = 'high';
    var still = performance.now() - lastInput > 250 && !walking && Math.abs(vel) < 0.01;
    if (hi.ready && hi.i === Math.round(pos) && still && Math.abs(pos - hi.i) < 0.02) {
      drawImg(hi.img, 1);
      shownIdx = hi.i;
    } else if (opts.blend === 'fade' && f > 0.01 && frames[a] && frames[b]) {
      drawImg(frames[a], 1);
      drawImg(frames[b], f);
      shownIdx = pos;
    } else {
      var ir = nearest(Math.round(pos));
      drawImg(frames[ir], 1);
      shownIdx = ir;
    }
    ctx.globalAlpha = 1;
  }

  // High-res still once the walker has stopped for a moment
  function maybeHighRes(now) {
    var i = Math.round(pos);
    if (now - lastInput < 250 || walking || Math.abs(vel) > 0.01 || Math.abs(pos - i) > 0.02 || hi.i === i) return;
    var img = new Image();
    hi = { i: i, img: img, ready: false };
    img.onload = function () { if (hi.img === img) { hi.ready = true; dirty = true; } };
    img.src = url('highres', i);
  }

  // ---------- loop ----------
  var last = performance.now(), fpsT = last, fpsN = 0, fps = 0, lastPos = 0, speed = 0;
  function tick(now) {
    var dt = Math.min(50, now - last) / 16.67; // in 60 Hz frames
    last = now;

    if (walking || latched) {
      target = clamp(target + Number(opts.pace) * stillsPerMetre * dt / 60);
      lastInput = now;
    }
    if (vel) {
      nudge(vel * dt);
      vel *= Math.pow(opts.glide === 'long' ? 0.965 : 0.9, dt);
      if (Math.abs(vel) < 0.05 || target <= 0 || target >= n - 1) vel = 0;
    }

    var before = pos;
    if (opts.ease === 'direct') pos = target;
    else {
      // 2015: 1/10 of the remaining distance per frame (streetwalk.js computeAnimation)
      var k = opts.ease === '2015' ? 10 : 3;
      pos += (target - pos) * (1 - Math.pow(1 - 1 / k, dt));
      if (Math.abs(target - pos) < 0.002) pos = target;
    }
    if (opts.blend === 'off' && Math.round(pos) === Math.round(before) && pos !== target) {
      // stepping: nothing visible changes until the rounded still does
    } else if (pos !== before) dirty = true;

    if (dirty && n) { dirty = false; draw(); }
    maybeHighRes(now);

    fpsN++;
    if (now - fpsT > 500) {
      fps = Math.round(fpsN * 1000 / (now - fpsT));
      speed = Math.abs(pos - lastPos) / stillsPerMetre / ((now - fpsT) / 1000);
      lastPos = pos; fpsN = 0; fpsT = now;
      hud.textContent = WAY + '\n' + (Math.round(pos) + 1) + ' / ' + n + ' stills · ' + (pos / stillsPerMetre).toFixed(1) + ' m\n' +
        speed.toFixed(1) + ' m/s · ' + fps + ' fps · ' + loaded + ' loaded' + (lagText());
    }
    requestAnimationFrame(tick);
  }
  function lagText() {
    var lag = Math.abs(target - pos) / stillsPerMetre;
    return lag > 0.05 ? '\nbehind input ' + lag.toFixed(2) + ' m' : '';
  }

  fetch(WAYS_URL).then(function (r) { return r.json(); }).then(function (ways) {
    var w = ways.filter(function (x) { return x.wayName === WAY; })[0];
    if (!w) throw new Error('unknown way ' + WAY);
    n = w.nbStills;
    // stills per metre from the path length, as the 2015 app scales body height by it
    var len = 0, p = w.wayPath;
    for (var i = 1; i < p.length; i++) {
      var la1 = p[i - 1][1] * Math.PI / 180, la2 = p[i][1] * Math.PI / 180;
      var dla = la2 - la1, dlo = (p[i][0] - p[i - 1][0]) * Math.PI / 180;
      var h = Math.sin(dla / 2) * Math.sin(dla / 2) + Math.cos(la1) * Math.cos(la2) * Math.sin(dlo / 2) * Math.sin(dlo / 2);
      len += 2 * 6371000 * Math.asin(Math.sqrt(h));
    }
    stillsPerMetre = n / len;
    frames = new Array(n);
    load();
    window.__lab = { get pos() { return pos; }, get target() { return target; }, get loaded() { return loaded; }, get n() { return n; }, get shown() { return shownIdx; }, opts: opts, nudge: nudge };
    requestAnimationFrame(tick);
  }).catch(function (e) { hud.textContent = 'error: ' + e.message; });
})();
</script>
</body>
</html>
